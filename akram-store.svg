<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Akram Store banner with four smartphones" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="1200" height="500" fill="#1d1d1f"/>

  <!-- Store name and tagline -->
  <text x="70" y="225" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="#ffffff">Akram Store</text>
  <text x="74" y="285" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d2d2d7">iPhone 12, 13, 14 and 16</text>
  <text x="74" y="330" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8e8e93">Original phones, clear prices</text>

  <!-- Phone 1: iPhone 12 (white) -->
  <g transform="translate(560 170)">
    <rect width="120" height="240" rx="24" fill="#f0f0f0"/>
    <rect x="7" y="7" width="106" height="226" rx="18" fill="#101014"/>
    <rect x="42" y="14" width="36" height="9" rx="4.5" fill="#000"/>
  </g>

  <!-- Phone 2: iPhone 13 (blue) -->
  <g transform="translate(700 120)">
    <rect width="120" height="240" rx="24" fill="#4a90d9"/>
    <rect x="7" y="7" width="106" height="226" rx="18" fill="#101014"/>
    <rect x="42" y="14" width="36" height="9" rx="4.5" fill="#000"/>
  </g>

  <!-- Phone 3: iPhone 14 (purple) -->
  <g transform="translate(840 150)">
    <rect width="120" height="240" rx="24" fill="#b9a7e0"/>
    <rect x="7" y="7" width="106" height="226" rx="18" fill="#101014"/>
    <rect x="42" y="14" width="36" height="9" rx="4.5" fill="#000"/>
  </g>

  <!-- Phone 4: iPhone 16 (teal) -->
  <g transform="translate(980 100)">
    <rect width="120" height="240" rx="24" fill="#7fb5b0"/>
    <rect x="7" y="7" width="106" height="226" rx="18" fill="#101014"/>
    <rect x="42" y="14" width="36" height="9" rx="4.5" fill="#000"/>
  </g>
</svg>
